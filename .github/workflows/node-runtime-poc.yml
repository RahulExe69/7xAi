name: Node Android Runtime POC Inspection

on:
  push:
    branches:
      - "feat/**"
    paths:
      - "runtime/node-runtime*.json"
      - "scripts/fetch-libnode.sh"
      - ".github/workflows/node-runtime-poc.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: node-runtime-poc-${{ github.ref }}
  cancel-in-progress: true

jobs:
  inspect:
    name: Compare full and lite Android Node POC
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node.js 24
        uses: actions/setup-node@v5
        with:
          node-version: "24.x"

      - name: Configure Android SDK and NDK
        run: |
          echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> "$GITHUB_ENV"
          echo "/usr/local/lib/android/sdk/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          export PATH="/usr/local/lib/android/sdk/cmdline-tools/latest/bin:$PATH"
          yes | sdkmanager --licenses
          sdkmanager "ndk;27.3.13750724"

      - name: Validate provenance and fetch both POC profiles
        run: |
          node --test tests/runtime-manifest.test.mjs
          node scripts/validate-runtime-manifest.mjs runtime/node-runtime.json
          node scripts/validate-runtime-manifest.mjs runtime/node-runtime-lite.json
          bash -n scripts/fetch-libnode.sh
          bash scripts/fetch-libnode.sh runtime/node-runtime.json
          bash scripts/fetch-libnode.sh runtime/node-runtime-lite.json

      - name: Inspect each profile and test ABI
        shell: bash
        run: |
          set -euo pipefail
          STRIP_TOOL="$ANDROID_HOME/ndk/27.3.13750724/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-strip"
          test -x "$STRIP_TOOL"

          for profile in full lite; do
            for abi in arm64-v8a x86_64; do
              LIB="runtime/poc/$profile/$abi/libnode.so"
              STRIPPED="runtime/poc/$profile/$abi/libnode.stripped.so"
              REPORT="runtime/poc/$profile/$abi"
              test -s "$LIB"

              file "$LIB" | tee "$REPORT/libnode.file.txt"
              readelf -h "$LIB" | tee "$REPORT/libnode.elf-header.txt"
              if [[ "$abi" == "arm64-v8a" ]]; then
                grep -Fq "AArch64" "$REPORT/libnode.elf-header.txt"
              else
                grep -Eq "X86-64|Advanced Micro Devices X86-64" "$REPORT/libnode.elf-header.txt"
              fi
              readelf -dW "$LIB" | tee "$REPORT/libnode.dynamic.txt"
              readelf -lW "$LIB" | tee "$REPORT/libnode.program-headers.txt"

              python3 - "$REPORT/libnode.program-headers.txt" <<'PY'
          import re
          import sys
          from pathlib import Path

          text = Path(sys.argv[1]).read_text()
          alignments = []
          for line in text.splitlines():
              fields = line.split()
              if fields and fields[0] == "LOAD":
                  candidate = fields[-1]
                  if re.fullmatch(r"0x[0-9a-fA-F]+", candidate):
                      alignments.append(int(candidate, 16))
          if not alignments:
              raise SystemExit("No ELF LOAD segment alignments were found")
          smallest = min(alignments)
          print(f"Smallest PT_LOAD alignment: 0x{smallest:x} ({smallest} bytes)")
          if smallest < 16384:
              raise SystemExit("ELF does not meet the 16 KB page-alignment floor")
          PY

              cp "$LIB" "$STRIPPED"
              "$STRIP_TOOL" --strip-debug "$STRIPPED"
              readelf --dyn-syms --wide "$LIB" | awk '/GLOBAL/ {print $8}' | sort -u > "$REPORT/symbols-before.txt"
              readelf --dyn-syms --wide "$STRIPPED" | awk '/GLOBAL/ {print $8}' | sort -u > "$REPORT/symbols-after.txt"
              diff -u "$REPORT/symbols-before.txt" "$REPORT/symbols-after.txt"

              UNSTRIPPED_BYTES="$(stat -c %s "$LIB")"
              STRIPPED_BYTES="$(stat -c %s "$STRIPPED")"
              UNSTRIPPED_SHA="$(sha256sum "$LIB" | cut -d' ' -f1)"
              STRIPPED_SHA="$(sha256sum "$STRIPPED" | cut -d' ' -f1)"
              printf '%s  %s\n' "$UNSTRIPPED_SHA" "$LIB" > "$REPORT/libnode.sha256"
              printf '%s  %s\n' "$STRIPPED_SHA" "$STRIPPED" > "$REPORT/libnode.stripped.sha256"
              printf 'Profile: %s\nABI: %s\nUnstripped bytes: %s\nStripped bytes: %s\nUnstripped SHA-256: %s\nStripped SHA-256: %s\n' \
                "$profile" "$abi" "$UNSTRIPPED_BYTES" "$STRIPPED_BYTES" "$UNSTRIPPED_SHA" "$STRIPPED_SHA" > "$REPORT/libnode.sizes.txt"
            done
          done

          {
            echo "## Node mobile profile size comparison (POC only)"
            echo
            for profile in full lite; do
              for abi in arm64-v8a x86_64; do
                echo "### $profile / $abi"
                cat "runtime/poc/$profile/$abi/libnode.sizes.txt"
                echo
                echo "Dependencies:"
                grep NEEDED "runtime/poc/$profile/$abi/libnode.dynamic.txt" || true
                echo
              done
            done
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload inspection reports only
        uses: actions/upload-artifact@v4
        with:
          name: node-android-runtime-profile-comparison
          path: |
            runtime/poc/*/*/*.txt
            runtime/poc/*/*/*.sha256
          if-no-files-found: error
          retention-days: 7
